[Settings]
; =========================================================
; GitHub Actions 专用配置
; 使用场景：定时运行一次 -> 抓取 -> IPv4 筛选 -> 测速 -> 输出 -> Commit
; =========================================================


; =========================
; 基础功能
; =========================

open_update = True

; 模板没有匹配到的频道不直接塞进结果
open_unmatch_category = False

; 模板里的频道即使最终没有可用源，也保留空分类方便发现缺台
open_empty_category = True

; 显示更新时间
open_update_time = True
update_time_position = top

; 不在播放地址后追加来源/分辨率等 $ 信息
; 播放器兼容性更好，结果也更干净
open_url_info = False

language = zh_CN


; =========================
; EPG / M3U
; =========================

open_epg = True

; 不自动抓每个订阅源声明的 EPG
; 多订阅情况下可明显减少网络、XML 解压、CPU 和内存消耗
open_subscribe_epg = False

open_m3u_result = True


; =========================
; 每频道输出数量
; =========================

; 新版推荐配置名
output_urls_limit = 5

; quick 模式目标设为 0
; 自动跟随 output_urls_limit，即找到 5 个有效源后即可停止该频道剩余测速
speed_test_target = 0
quick_test_target = 0


; =========================
; GitHub Actions 执行方式
; =========================

; Actions 的执行频率由 workflow cron 控制
; 程序自己只运行一次
update_mode = interval
update_interval = 0
update_times =
update_startup = True

time_zone = Asia/Shanghai


; =========================
; 输入 / 输出文件
; =========================

source_file = config/user_demo.txt

final_file = output/my_little_secret_tv_result.txt


; =========================
; GitHub Actions 服务设置
; =========================

; Actions 结束后 runner 会销毁
; 没必要边测速边提供实时结果
open_realtime_write = False

; Actions 不需要启动长期 HTTP 页面服务
open_service = False

; 以下保留默认兼容值即可
service_port = 8080
public_url =
app_port = 5180
public_scheme = http
public_domain = 127.0.0.1


; =========================
; 网络代理
; =========================

; Actions 通常可以直接访问 GitHub Raw
; 不增加第三方代理故障点
cdn_url =

http_proxy =


; =========================
; 数据源
; =========================

open_local = True
open_subscribe = True

; 不建议 Actions 自动修改 subscribe.txt / epg.txt
; 某次临时网络故障可能把原本正常的源永久注释掉
open_auto_disable_source = False

; 将上一次结果重新作为候选
; 两天更新一次时非常有用，可增加频道存活率
open_history = True


; =========================
; M3U Headers
; =========================

; 含特殊请求头的直播地址播放器兼容性较差
; 家庭电视环境优先稳定兼容
open_headers = False

; 使用程序内置 UA
user_agent =


; =========================
; 测速模式
; =========================

open_speed_test = True

; 新版推荐 quick
; 达到所需有效源数量后停止该频道剩余候选测速
speed_test_mode = quick

; 不自动生成直播截图
; Actions 中纯属额外 FFmpeg 解码开销
open_stream_screenshot = False
stream_screenshot_timeout = 5
stream_screenshot_width = 640


; =========================
; 质量过滤
; =========================

open_filter_resolution = True
open_filter_speed = True

; 过滤无信号/广告循环占位源
; 文档说明复用测速阶段已有数据，不额外增加测速请求
open_filter_ad = True

; quick 模式，不全量测试所有候选
open_full_speed_test = False


; =========================
; 补偿机制
; =========================

; 如果某频道凑不够 5 个合格源
; 允许把稍慢但仍可能播放的源放在最后作为备用
open_supply = True


; =========================
; 排序方式
; =========================

; 家庭 IPTV 优先实际速度
sort_by = speed


; =========================
; 分辨率
; =========================

; 最低保留 720P
min_resolution = 1280x720

; 最高允许 4K
max_resolution = 3840x2160


; =========================
; 最低速度
; 单位 MiB/s
; =========================

; 全局门槛保持宽松，避免冷门频道被大量过滤
min_speed = 0.2

; 不同分辨率要求不同速度
resolution_speed_map = 1280x720:0.2,1920x1080:0.5,3840x2160:1.0


; =========================
; GitHub Actions 性能
; =========================

; 让新版程序根据 runner CPU / 内存自动决定性能参数
performance_mode = auto

; 0 = 交给 performance_mode 自动决定测速网络并发
; 比旧版手工固定 15 更适合不同规格的 Actions runner
speed_test_limit = 0

; 单个直播源测速超时
speed_test_timeout = 10

; 不按 Host 共用测速结果
; 稍慢一点，但准确性更好
speed_test_filter_host = False

; 拉取订阅等普通网络请求超时
request_timeout = 10


; =========================
; IPv4
; 你家网络只有 IPv4，所以明确禁用 IPv6
; =========================

ipv6_support = False

; 最终结果只保留 IPv4
ipv_type = ipv4

; IPv4 优先
ipv_type_prefer = ipv4


; =========================
; 地区 / 运营商
; =========================

; 暂时不限制
; 因为 GitHub Actions runner 的网络位置并不代表你家网络位置
location =
isp =


; =========================
; 来源排序
; =========================

; 不人为规定 local / subscribe 谁优先
; 让测速结果决定排序
origin_type_prefer =


; =========================
; 本地源 / 订阅源候选数量
; =========================

local_num = 10
subscribe_num = 10


; =========================
; 台标
; =========================

logo_url = https://www.xn--rgv465a.top/tvlogo
logo_type = png

; M3U 自带 tvg-logo 时优先使用
; 没有时再回退到上面的台标库
open_subscribe_logo = True


; =========================
; RTMP
; =========================

; GitHub Actions runner 是临时机器
; RTMP 推流服务没有实际意义，必须关闭
open_rtmp = False

; 以下仅为兼容参数，关闭 RTMP 后不会实际使用
nginx_http_port = 8080
nginx_rtmp_port = 1935
rtmp_idle_timeout = 300
rtmp_max_streams = 10
rtmp_transcode_mode = copy